{% extends "base.html" %}
{% block crumb %}Ro'yxatdan o'tish{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h1>Ro'yxatdan o'tish</h1>
  <form method="post">
    {% csrf_token %}
    {% for f in form %}
      <label for="{{ f.id_for_label }}">{{ f.label }}</label>
      {{ f }}
      {% for e in f.errors %}<small style="color:var(--red)">{{ e }}</small>{% endfor %}
    {% endfor %}
    <div style="margin-top:16px"><button class="btn" type="submit">Ro'yxatdan o'tish</button></div>
  </form>
  <p style="margin-top:14px">Akkountingiz bormi? <a href="{% url 'login' %}" style="text-decoration:underline">Kirish</a></p>
</div>
{% endblock %}
