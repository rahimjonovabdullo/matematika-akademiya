<style>
.tg-wrap{margin-top:auto;padding-top:18px}
.tg-card{display:block;position:relative;overflow:hidden;border-radius:20px;padding:16px;color:#fff;background:linear-gradient(145deg,#3cbdff 0%,#1d8fd0 100%);box-shadow:0 10px 24px rgba(34,158,217,.32);transition:transform .2s,box-shadow .2s}
.tg-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(34,158,217,.45)}
.tg-card::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.tg-card::after{content:"";position:absolute;right:20px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1)}
.tg-card>*{position:relative;z-index:1}

.tg-card b{display:block;font-size:16px;line-height:1.2;margin-bottom:4px}
.tg-card p{margin:0 0 12px;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88)}
.tg-join{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#1d8fd0;font-weight:800;font-size:13px;padding:10px 12px;border-radius:99px}
.tg-join span{display:inline-block;transition:transform .2s}
.tg-card:hover .tg-join span{transform:translateX(4px)}
@keyframes tgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (min-width:901px){
 .side{height:calc(100vh - 32px);display:flex;flex-direction:column;overflow-y:auto}
 .side>*{flex-shrink:0}
}
@media (max-width:900px){.tg-wrap{display:none}}
@media (prefers-reduced-motion:reduce){.tg-logo{animation:none}}
</style>
