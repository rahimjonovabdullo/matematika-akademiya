{% extends "base.html" %}
{% block title %}SAT natijasi — {{ attempt.course.title }}{% endblock %}
{% block content %}
<style>
.sr{max-width:860px;margin:0 auto;padding:6px 0 40px;display:grid;gap:16px;align-content:start}
.sr-c{background:#fff;border:1px solid #e8eae4;border-radius:26px;padding:26px 28px;box-shadow:0 6px 24px rgba(22,40,29,.05)}
.sr-chip{display:inline-block;background:#f4f8e6;border:1px solid #e1ecb8;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.08em;color:#16281d}
.sr h1{margin:14px 0 12px;font-size:32px}
.sr-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sr-meta span{background:#f3f4f0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:#475569}
.sr-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:800;text-decoration:none;font-size:14px;background:#fff;border:1px solid #e8eae4;color:#16281d}
.sr-btn.p{background:#d3f24a;border-color:#d3f24a}
.sr-btn .bi{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr-tot{text-align:center}
.sr-tot small{letter-spacing:.14em;font-weight:800;color:#64748b;font-size:12px}
.sr-big{font-size:92px;line-height:1.05;font-weight:800;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.sr-sub{color:#64748b;font-size:14px}

.sr-rng{max-width:440px;margin:26px auto 0;text-align:left}
.sr-rng div.t{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:#475569}
.sr-bar{height:8px;border-radius:99px;background:#eef0ea;margin-top:10px;position:relative}
.sr-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#a3c91a}
.sr-bar b{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#a3c91a;margin-left:-8px}
.sr-ax{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-top:6px}
.sr-note{font-size:12px;color:#94a3b8;margin-top:12px;line-height:1.5}
.sr-g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sr-sec h3{margin:0;font-size:17px}.sr-sec small{color:#64748b}
.sr-sec .n{font-size:58px;font-weight:800;margin:16px 0 8px;line-height:1}
.sr-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.sr-st div{background:#f8f9f5;border:1px solid #eef0ea;border-radius:12px;padding:10px 12px}
.sr-st b{display:block;font-size:20px}.sr-st span{font-size:11px;color:#64748b}
.sr-m{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.sr-m>div{background:#f8f9f5;border:1px solid #eef0ea;border-radius:14px;padding:12px}
.sr-m small{font-size:10px;font-weight:800;letter-spacing:.06em;color:#64748b;text-transform:uppercase}
.sr-m b{display:block;margin-top:2px;font-size:14px}
.sr-m p{display:flex;justify-content:space-between;margin:8px 0 6px;font-weight:800}
.sr-m p span{color:#64748b;font-weight:600}
.sr-act{display:flex;gap:10px;flex-wrap:wrap}
#dn{position:fixed;inset:0;z-index:90;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#dn .ck{width:84px;height:84px;border-radius:50%;background:#d3f24a;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
#dn h2{font-size:34px;margin:0 0 8px}#dn p{color:#64748b;margin:4px 0}
@media (max-width:700px){.sr-g{grid-template-columns:1fr}.sr-m{grid-template-columns:1fr 1fr}.sr-big{font-size:68px}}
