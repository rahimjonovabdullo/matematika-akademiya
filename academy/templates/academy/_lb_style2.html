<style>
  /* ---------- Ro'yxat ---------- */
  .lb-listhead { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 12px; }

  .lb-listhead span { color: var(--mute); font-size: 13px; font-weight: 700; }
  .lb-list { display: flex; flex-direction: column; gap: 10px; }
  .lb-row {
    display: grid; grid-template-columns: 52px 50px minmax(0, 1.2fr) minmax(0, 1.6fr) auto;
    align-items: center; gap: 14px; padding: 14px 20px 14px 14px; border-radius: 24px; background: #fff; border: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(22, 40, 29, .04); animation: lbFade .5s ease both; transition: transform .18s, box-shadow .18s, border-color .18s;
  }

    width: 46px; height: 46px; border-radius: 50%; background: #eef0ea; color: var(--g);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
  }
  .lb-row.me .lb-av { background: var(--lime); }
  .lb-name { font-weight: 800; font-size: 16px; line-height: 1.7; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-name em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .08em; background: var(--g); color: var(--lime); padding: 3px 8px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .lb-bar { height: 12px; background: #eef0ea; border-radius: 999px; overflow: hidden; }
  .lb-bar span { display: block; height: 100%; background: linear-gradient(90deg, #a9d92a, #d3f24a); border-radius: 999px; transform-origin: left; animation: lbGrow 1s cubic-bezier(.2, .9, .3, 1) both; box-shadow: 0 0 12px rgba(180, 225, 40, .7); }

  .lb-empty { background: #fff; border: 1px dashed #cfd4c6; border-radius: 24px; padding: 56px 20px; text-align: center; color: var(--mute); }
  .lb-empty svg { width: 64px; height: 64px; margin-bottom: 10px; }

  @keyframes lbRise { from { opacity: 0; transform: translateY(34px); } to { opacity: 1; transform: none; } }
  @keyframes lbFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes lbGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes lbFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
  @keyframes lbBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  @keyframes lbTwinkle { 0%, 100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(25deg); } }
  @media (prefers-reduced-motion: reduce) { .lb-pod, .lb-row, .lb-bar span, .lb-trophy, .lb-crown, .lb-spark, .lb-pod-av { animation: none !important; } }

    .p1 .lb-pod-name { font-size: 15px; }
    .lb-pod-ball { font-size: 22px; }

    .p2 .lb-ped { height: 84px; }

    .lb-av { width: 40px; height: 40px; font-size: 16px; }
    .lb-me { padding: 16px; }
  }
</style>
