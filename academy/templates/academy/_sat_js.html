<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var M = SAT.mods, KEY = SAT.key;
  var S = { ph: 'intro', m: 0, q: 0, a: {}, mk: {}, cut: {}, end: {}, used: {}, bEnd: 0, bm: 0 };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); if (o && o.ph && o.m < M.length) S = o; }
  } catch (e) {}
  if (!S.used) S.used = {};
  var eo = false, sending = false;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var mods = document.querySelectorAll('.mod'), mis = document.querySelectorAll('.mi');
  function qEl(m, i) { return mods[m].querySelectorAll('.qq')[i]; }
  function qid(m, i) { return M[m].ids[i]; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  var views = ['vIntro', 'vMI', 'vTest', 'vReview', 'vReady', 'vBreak'];
  function showView(id) { views.forEach(function (v) { $(v).hidden = v !== id; }); }
  function closeAll() { ['mNav', 'mConf', 'mDir', 'mRef'].forEach(function (i) { $(i).hidden = true; }); }
  function label(m) { return mods[m].getAttribute('data-t'); }

  function prev(el, v) {
    var p = el.querySelector('.sxv'); if (!p) return;
    var f = /^(-?)(\d+)\/(\d+)$/.exec(v);
    if (f) p.innerHTML = (f[1] ? '\u2212' : '') + '<span class="sxf"><span>' + f[2] + '</span><span>' + f[3] + '</span></span>';
    else p.textContent = v.replace(/^-/, '\u2212');
  }
  function paintQ() {
    var el = qEl(S.m, S.q), id = qid(S.m, S.q);
    el.querySelectorAll('.ch').forEach(function (c) {
      var cid = c.getAttribute('data-c');
      c.classList.toggle('sel', S.a[id] == cid);
      c.classList.toggle('cut', !!S.cut[cid]);
    });
    el.querySelector('.mk').classList.toggle('on', !!S.mk[id]);
    el.querySelector('.abc').classList.toggle('on', eo);
    el.querySelector('.pr').classList.toggle('elim', eo);
    var inp = el.querySelector('.sxi');
    if (inp) {
      if (document.activeElement !== inp) inp.value = S.a[id] || '';
      prev(el, S.a[id] || '');
    }
    $('dvh').hidden = el.classList.contains('single');
  }
  function grid(box, onPick) {
    box.innerHTML = '';
    M[S.m].ids.forEach(function (id, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = i + 1;
      b.className = 'gb' + (S.a[id] ? ' done' : '') + (S.mk[id] ? ' fl' : '') + (i === S.q ? ' cur' : '');
      b.onclick = function () { onPick(i); };
      box.appendChild(b);
    });
  }
  function render() {
    closeAll();
    if (S.ph === 'intro') { showView('vIntro'); return; }
    if (S.ph === 'mi') {
      showView('vMI');
      mis.forEach(function (d, i) { d.hidden = i !== S.m; });
      return;
    }
    if (S.ph === 'review') {
      showView('vReview');
      $('rvT').textContent = label(S.m) + ' Questions';
      grid($('rvGrid'), function (i) { S.q = i; S.ph = 'test'; save(); render(); });
      return;
    }
    if (S.ph === 'ready') {
      showView('vReady');
      $('rdT').textContent = 'Module ' + M[S.bm + 1].mn + ' is next';
      $('rdP').textContent = 'Module ' + M[S.bm].mn + ' is complete. ' + M[S.bm + 1].ids.length + ' questions are waiting in the next module.';
      return;
    }
    if (S.ph === 'break') { showView('vBreak'); tick(); return; }
    showView('vTest');
    mods.forEach(function (d, i) { d.hidden = i !== S.m; });
    mods[S.m].querySelectorAll('.qq').forEach(function (d, i) { d.hidden = i !== S.q; });
    var math = M[S.m].sec === 'math';
    $('mTitle').textContent = label(S.m);
    $('btnAnn').hidden = math; $('btnCalc').hidden = !math; $('btnRef').hidden = !math;
    if (!math) { $('calc').hidden = true; }
    $('cur').textContent = S.q + 1; $('cnt').textContent = M[S.m].ids.length;
    $('backBtn').style.visibility = S.q === 0 ? 'hidden' : 'visible';
    $('nextBtn').textContent = 'Next';
    paintQ();
    tick();
  }
  function go(i) { S.q = i; eo = false; save(); render(); }
  function startModule(m) {
    S.m = m; S.q = 0; S.ph = 'test'; eo = false;
    if (!S.end[m]) S.end[m] = Date.now() + M[m].minutes * 60000;
    save(); render();
  }
  function toMI(m) { S.m = m; S.ph = 'mi'; save(); render(); }
  function finish() {
    var total = M[S.m].minutes * 60, left = Math.max(0, (S.end[S.m] - Date.now()) / 1000);
    S.used[S.m] = Math.round(Math.min(total, total - left));
    if (S.m + 1 >= M.length) { submit(); return; }
    S.bm = S.m;
    if (M[S.m + 1].sec !== M[S.m].sec) { S.ph = 'break'; S.bEnd = Date.now() + 600000; }
    else { S.ph = 'ready'; S.bEnd = 0; }
    save(); render();
  }
  function submit() {
    if (sending) return; sending = true;
    var box = $('satAns'); box.innerHTML = '';
    function add(n, v) { var i = document.createElement('input'); i.type = 'hidden'; i.name = n; i.value = v; box.appendChild(i); }
    Object.keys(S.a).forEach(function (id) { add('q' + id, S.a[id]); });
    var secs = 0; Object.keys(S.used).forEach(function (k) { secs += S.used[k]; });
    add('secs', secs);
    try { localStorage.removeItem(KEY); } catch (e) {}
    $('satForm').submit();
  }
  function tick() {
    if (S.ph === 'test') {
      var left = S.end[S.m] - Date.now();
      $('tm').textContent = fmt(left); $('tm').className = left < 60000 ? 'warn' : '';
      if (left <= 0) finish();
    } else if (S.ph === 'break') {
      var l2 = S.bEnd - Date.now();
      $('brTm').textContent = fmt(l2);
      if (l2 <= 0) toMI(S.bm + 1);
    }
  }
  setInterval(tick, 500);

  $('goBtn').onclick = function () { toMI(0); };
  $('miGo').onclick = function () { startModule(S.m); };
  $('rdGo').onclick = function () { toMI(S.bm + 1); };
  $('brGo').onclick = function () { toMI(S.bm + 1); };
  $('backBtn').onclick = function () { if (S.q > 0) go(S.q - 1); };
  $('nextBtn').onclick = function () {
    if (S.q < M[S.m].ids.length - 1) go(S.q + 1);
    else { S.ph = 'review'; save(); render(); }
  };
  $('rvBack').onclick = function () { S.ph = 'test'; save(); render(); };
  $('rvDone').onclick = function () {
    var left = M[S.m].ids.filter(function (id) { return !S.a[id]; }).length;
    var w = $('cfW'); w.hidden = !left; w.textContent = 'You have ' + left + (left === 1 ? ' unanswered question.' : ' unanswered questions.');
    $('mConf').hidden = false;
  };
  $('cfYes').onclick = function () { $('mConf').hidden = true; finish(); };
  $('navBtn').onclick = function () {
    $('nvT').textContent = label(S.m);
    grid($('nvGrid'), function (i) { $('mNav').hidden = true; go(i); });
    $('mNav').hidden = false;
  };
  $('nvRev').onclick = function () { S.ph = 'review'; save(); render(); };
  $('tmHide').onclick = function () {
    var h = $('tm').style.display === 'none';
    $('tm').style.display = h ? '' : 'none'; this.textContent = h ? 'Hide' : 'Show';
  };
  $('stMain').addEventListener('click', function (e) {
    var id = qid(S.m, S.q), t = e.target;
    var act = t.closest('[data-act]'), ch = t.closest('.ch');
    if (act && act.getAttribute('data-act') === 'mark') { S.mk[id] = !S.mk[id]; }
    else if (act && act.getAttribute('data-act') === 'elim') { eo = !eo; }
    else if (act && act.getAttribute('data-act') === 'x') { var cid = ch.getAttribute('data-c'); S.cut[cid] = !S.cut[cid]; }
    else if (ch) { var c = ch.getAttribute('data-c'); if (S.a[id] == c) delete S.a[id]; else S.a[id] = c; }
    else return;
    save(); paintQ();
  });
  $('stMain').addEventListener('input', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('sxi')) return;
    var r = t.value.replace(/[^0-9.\/-]/g, '');
    r = r.charAt(0) === '-' ? '-' + r.slice(1).replace(/-/g, '') : r.replace(/-/g, '');
    r = r.slice(0, r.charAt(0) === '-' ? 6 : 5);
    if (t.value !== r) t.value = r;
    var id = qid(S.m, S.q), v = r;
    if (v) S.a[id] = v; else delete S.a[id];
    save(); prev(qEl(S.m, S.q), v);
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.ph !== 'intro' && !sending) { e.preventDefault(); e.returnValue = ''; }
  });
  window.SATX = { S: function () { return S; } };
  render();
})();
</script>
