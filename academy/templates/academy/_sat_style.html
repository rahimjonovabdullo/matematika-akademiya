<style>
.sat{--ink:#16281d;--lime:#d3f24a;--ln:#e2e8f0;--mut:#64748b;position:fixed;inset:0;z-index:60;background:#fff;color:#111827;font-family:inherit;display:flex;flex-direction:column}
.sat *{box-sizing:border-box}
.sat button{font:inherit;cursor:pointer}
.sat [hidden]{display:none!important}
.sv{flex:1;min-height:0;display:flex;flex-direction:column}
.bn{background:var(--ink);color:var(--lime);text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;padding:5px 0;margin:0 12px;border-radius:0 0 8px 8px}
.st-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 20px 8px;background:#fff}
.st-ttl b{display:block;font-size:17px;font-weight:800}
.lnk{background:none;border:0;padding:2px 0;color:var(--ink);font-weight:700;font-size:13px}
.st-time{text-align:center}
.st-time b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.st-time b.warn{color:#dc2626}
.st-time .lnk{color:var(--mut);border:1px solid #cbd5e1;border-radius:999px;padding:1px 12px;font-weight:600;font-size:12px}
.st-tools{display:flex;gap:4px;justify-content:flex-end}
.tl{background:none;border:0;border-radius:10px;padding:4px 10px;font-weight:700;font-size:11px;color:#475569;display:flex;flex-direction:column;align-items:center;gap:3px}
.tl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tl:hover{background:#f1f5f9}
.tl.on{background:var(--ink);color:var(--lime)}
.st-main{flex:1;min-height:0;position:relative;border-top:1px solid var(--ln);--l:50%}
.qq{position:absolute;inset:0;display:grid;grid-template-columns:var(--l) 1fr}
.qq.single{grid-template-columns:minmax(0,760px);justify-content:center}
.pn{overflow:auto;padding:26px 34px;min-width:0}
.pl{font-size:17px;line-height:1.7;font-family:Georgia,"Times New Roman",serif}
.pl p{margin:0 0 14px}
.pl img,.pr img{max-width:min(100%,420px);max-height:260px;width:auto;height:auto;object-fit:contain;border-radius:8px;margin:6px 0 14px;display:block}
.pl mark{background:#fde047;color:inherit;cursor:pointer;border-radius:2px}
.pl.ann{cursor:text}
.dvh{position:absolute;top:0;bottom:0;width:14px;margin-left:-7px;cursor:col-resize;z-index:3;display:flex;align-items:center;justify-content:center}
.dvh::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--ln)}
.dvh i{position:relative;width:12px;height:22px;background:#fff;border:1px solid #cbd5e1;border-radius:4px}
.qhd{display:flex;align-items:center;gap:10px;background:#f1f5f9;border-radius:8px;margin-bottom:18px;overflow:hidden;border-bottom:2px dotted #cbd5e1}
.qn{background:#111827;color:#fff;font-weight:800;min-width:38px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px}
.mk{background:none;border:0;display:flex;align-items:center;gap:6px;font-weight:700;color:#334155;padding:0 6px;height:36px;font-size:13px}
.mk svg{fill:none;stroke:currentColor;stroke-width:2}
.mk.on{color:#b91c1c}.mk.on svg{fill:#b91c1c}
.abc{margin-left:auto;background:#fff;border:1px solid #94a3b8;border-radius:6px;margin-right:8px;font-weight:800;font-size:11px;padding:3px 7px;text-decoration:line-through;color:#334155}
.abc.on{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.stem{font-size:16px;line-height:1.65;margin:0 0 18px}
.ch{display:flex;align-items:center;gap:12px;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 14px;margin-bottom:10px;cursor:pointer;font-size:16px;line-height:1.45;background:#fff}
.ch:hover{border-color:#94a3b8}
.ch .lt{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #334155;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ch .tx{flex:1;min-width:0}
.ch .xx{display:none;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #64748b;background:#fff;font-weight:800;font-size:11px;text-decoration:line-through;color:#475569}
.pr.elim .ch .xx{display:block}
.ch.sel{border-color:var(--ink);background:#f4f8e6;box-shadow:0 0 0 1px var(--ink)}
.ch.sel .lt{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.ch.cut{opacity:.5}.ch.cut .tx{text-decoration:line-through}
.ch.cut .xx{background:var(--ink);border-color:var(--ink);color:#fff;text-decoration:none}
.st-bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--ln);background:#fff}
.st-who{font-weight:800;font-size:15px}
.nv{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:800;font-size:13px}
.st-btns{display:flex;gap:10px;justify-content:flex-end}
.bb{border:0;border-radius:8px;padding:9px 22px;font-weight:800;font-size:14px;background:var(--ink);color:#fff}
.bb.ghost{background:#eef0ea;color:#334155}
.bb.lime{background:var(--lime);color:var(--ink);border-radius:999px;padding:11px 28px}
.bb:disabled{opacity:.4;cursor:default}
#calc{position:absolute;right:24px;top:20px;width:min(520px,94vw);height:min(540px,76vh);background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;z-index:4;overflow:hidden}
#calc .ch2{background:var(--ink);color:#fff;padding:8px 12px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;cursor:move;user-select:none}
#calc .ch2 button{background:none;border:0;color:#fff;font-size:18px;line-height:1}
#calcEl{flex:1;min-height:0}
@media (max-width:820px){.qq,.qq.single{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}.dvh{display:none}.pn{padding:16px}.st-top{grid-template-columns:1fr auto}.st-tools{grid-column:1/-1;justify-content:flex-start}.st-bot{grid-template-columns:auto 1fr;padding:10px 12px}.st-who{display:none}.nv{white-space:nowrap}}
</style>
